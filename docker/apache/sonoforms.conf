# Apache configuration for SonoForms: HTTPS only, reverse proxy to the app.
# Runs as an unprivileged user on 8443 (HTTPS) and 8080 (redirect only);
# docker-compose maps the host's 443/80 to these.

LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so

ServerName ${SERVER_NAME}
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 120
LimitRequestBody 5242880

# Access log without query strings, so nothing identifying in a URL is
# ever written to the container log (the image's default "common" log is
# disabled in the Dockerfile).
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b %D" sonoforms
CustomLog /proc/self/fd/1 sonoforms

Listen 8080
Listen 8443

# Plain HTTP only redirects to HTTPS.
<VirtualHost *:8080>
  RewriteEngine On
  RewriteRule ^ https://${SERVER_NAME}:${HTTPS_PORT}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# Mozilla "intermediate" TLS profile.
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
SSLHonorCipherOrder off
SSLSessionTickets off
SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"

<VirtualHost *:8443>
  SSLEngine on
  SSLCertificateFile /certs/server.crt
  SSLCertificateKeyFile /certs/server.key

  Header always set Strict-Transport-Security "max-age=31536000"
  Header always set X-Content-Type-Options "nosniff"
  Header always unset X-Powered-By

  # Discard any client-supplied X-Forwarded-For; mod_proxy then sends only
  # the real client address, which the app trusts (TRUST_PROXY=1).
  RequestHeader unset X-Forwarded-For early
  RequestHeader unset X-Forwarded-Host early
  RequestHeader set X-Forwarded-Proto "https"

  ProxyPreserveHost On
  ProxyRequests Off
  ProxyPass        / http://app:3000/ timeout=120
  ProxyPassReverse / http://app:3000/
</VirtualHost>
