# Apache configuration for SonoForms: HTTPS only, reverse proxy to the app.
# Runs as an unprivileged user on 8443 (HTTPS) and 8080 (redirect only);
# docker-compose maps the host's 443/80 to these.

# (mod_headers is already loaded by the stock httpd.conf.)
LoadModule ssl_module modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so

# Behind a hospital reverse proxy (UPSTREAM_PROXY in .env): accept the
# client address that proxy forwards, and from no one else. The entrypoint
# defines UPSTREAM_PROXY only when it's set to valid addresses.
<IfDefine UPSTREAM_PROXY>
  LoadModule remoteip_module modules/mod_remoteip.so
  RemoteIPHeader X-Forwarded-For
  # InternalProxy (not TrustedProxy): workstation addresses are private ones.
  RemoteIPInternalProxy ${UPSTREAM_PROXY}
</IfDefine>

ServerName ${SERVER_NAME}
ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 120
LimitRequestBody 5242880

# Access log without query strings, so nothing identifying in a URL is
# ever written to the container log (the image's default "common" log is
# disabled in the Dockerfile).
# %a is the client address (the forwarded one, behind a trusted upstream proxy).
LogFormat "%a %l %u %t \"%m %U %H\" %>s %b %D" sonoforms
CustomLog /proc/self/fd/1 sonoforms

Listen 8080
Listen 8443

# Plain HTTP only redirects to HTTPS.
<VirtualHost *:8080>
  RewriteEngine On
  RewriteRule ^ https://${SERVER_NAME}:${HTTPS_PORT}%{REQUEST_URI} [R=301,L]
</VirtualHost>

# Mozilla "intermediate" TLS profile.
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
SSLHonorCipherOrder off
SSLSessionTickets off
SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"

<VirtualHost *:8443>
  SSLEngine on
  SSLCertificateFile /certs/server.crt
  SSLCertificateKeyFile /certs/server.key

  Header always set Strict-Transport-Security "max-age=31536000"
  Header always set X-Content-Type-Options "nosniff"
  Header always unset X-Powered-By

  # Drop any X-Forwarded-For before proxying; mod_proxy then sends only the
  # client address Apache settled on (the connecting computer, or the one a
  # trusted UPSTREAM_PROXY forwarded), which the app trusts from Apache's
  # network only (TRUST_PROXY). Not "early", so mod_remoteip reads it first.
  RequestHeader unset X-Forwarded-For
  RequestHeader unset X-Forwarded-Host early
  RequestHeader set X-Forwarded-Proto "https"

  ProxyPreserveHost On
  ProxyRequests Off
  ProxyPass        / http://app:3000/ timeout=120
  ProxyPassReverse / http://app:3000/
</VirtualHost>
