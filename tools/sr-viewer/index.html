<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<!--
  SonoForms SR viewer: open a DICOM Structured Report (e.g. the measurements an
  ultrasound machine sends) and look at what's in it. Everything happens in
  this browser tab. The Content-Security-Policy below blocks all network
  access, so the file never leaves the computer.

  Open this file directly in a browser (double-click it), then drop an SR file
  onto the page. No server, install or internet connection is needed.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'">
<title>SR viewer · SonoForms</title>
<style>
  :root {
    --bg: #f5f7f8; --surface: #fff; --surface-2: #eef2f4; --text: #1b2629; --muted: #5d6b70;
    --border: #d7dee1; --accent: #1f7a8c; --accent-soft: #dff0f3; --warn: #9a6a00; --warn-soft: #fff4d6;
    --chosen: #1d7a46; --chosen-soft: #e3f4ea; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12181a; --surface: #1a2225; --surface-2: #222c30; --text: #e4ecee; --muted: #9aa9ae;
      --border: #33434a; --accent: #4fb3c7; --accent-soft: #1d3a41; --warn: #e0b24a; --warn-soft: #3a3020;
      --chosen: #5ccf8d; --chosen-soft: #1d3a2a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header.top { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 2; }
  header.top h1 { font-size: 1.05rem; margin: 0; }
  header.top .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .small { font-size: .85rem; }
  .mono { font-family: var(--mono); font-size: .85em; }
  main { max-width: 1400px; margin: 0 auto; padding: 16px 20px 48px; }
  button, .btn { font: inherit; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover, .btn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=search] { font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); min-width: 240px; }
  label.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  #drop { margin: 40px auto; max-width: 640px; border: 2px dashed var(--border); border-radius: 14px; padding: 48px 24px; text-align: center; background: var(--surface); }
  #drop.over { border-color: var(--accent); background: var(--accent-soft); }
  #drop h2 { margin: 0 0 8px; font-size: 1.2rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 24px; }
  .summary div { display: flex; flex-direction: column; min-width: 0; }
  .summary dt { font-size: .75rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .summary dd { margin: 0; overflow-wrap: anywhere; }
  .doc-title { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: .75rem; background: var(--surface-2); color: var(--muted); margin-left: 6px; vertical-align: middle; }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.ok { background: var(--chosen-soft); color: var(--chosen); }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 18px 0 12px; flex-wrap: wrap; }
  .tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 12px; color: var(--muted); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .toolbar .spacer { flex: 1; }
  .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { position: sticky; top: 0; background: var(--surface-2); font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  tr.dup td { opacity: .5; }
  tr.chosen td:first-child { box-shadow: inset 3px 0 0 var(--chosen); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tag { display: inline-block; padding: 0 6px; margin: 1px 4px 1px 0; border-radius: 6px; background: var(--surface-2); font-size: .8rem; white-space: nowrap; }
  .tag.chosen { background: var(--chosen-soft); color: var(--chosen); }
  .key { font-family: var(--mono); font-size: .78rem; color: var(--muted); white-space: nowrap; }
  .copy { padding: 0 6px; font-size: .75rem; margin-left: 4px; }
  .tree ul { list-style: none; margin: 0; padding-left: 20px; border-left: 1px dotted var(--border); }
  .tree > ul { padding-left: 0; border-left: none; }
  .tree li { margin: 2px 0; }
  .tree details > summary { cursor: pointer; list-style: none; }
  .tree details > summary::before { content: "▸ "; color: var(--muted); }
  .tree details[open] > summary::before { content: "▾ "; }
  .rel { font-family: var(--mono); font-size: .72rem; color: var(--muted); margin-right: 6px; }
  .vt { font-family: var(--mono); font-size: .72rem; padding: 0 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); margin-right: 6px; }
  .val { font-weight: 600; }
  .elements td { font-family: var(--mono); font-size: .8rem; }
  .elements td.v { font-family: inherit; font-size: .85rem; overflow-wrap: anywhere; max-width: 700px; }
  .note { background: var(--warn-soft); color: var(--text); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; border: 1px solid var(--border); }
  .err { background: #fde3e3; color: #7a1b1b; border-radius: 10px; padding: 10px 14px; margin: 14px 0; }
  .hidden { display: none !important; }
  .redacted { filter: blur(5px); user-select: none; }
</style>
</head>
<body>
<header class="top">
  <h1>SR viewer</h1>
  <span class="muted small">DICOM Structured Reports · files stay on this computer</span>
  <span class="spacer"></span>
  <label class="check small"><input type="checkbox" id="show-phi"> Show patient identifiers</label>
  <button id="open-btn" class="primary" type="button">Open SR file…</button>
  <input type="file" id="file" class="hidden" accept=".dcm,.DCM,application/dicom,*/*">
</header>
<main>
  <div id="drop">
    <h2>Drop a DICOM SR file here</h2>
    <p class="muted">or use <strong>Open SR file…</strong>. The file is read in this browser tab only; this page cannot send anything over the network.</p>
  </div>
  <div id="error" class="err hidden"></div>
  <div id="out" class="hidden">
    <section class="card" id="summary"></section>
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="measurements" class="on">Measurements</button>
      <button type="button" data-tab="tree">Content tree</button>
      <button type="button" data-tab="vendor">Vendor data</button>
      <button type="button" data-tab="elements">All elements</button>
    </nav>
    <section data-panel="measurements"></section>
    <section data-panel="tree" class="hidden"></section>
    <section data-panel="vendor" class="hidden"></section>
    <section data-panel="elements" class="hidden"></section>
  </div>
</main>

<!-- The parser and SR logic, kept separate from the page so it can be tested (test/sr-viewer.test.js). -->
<script id="sr-core">
'use strict';
/* global TextDecoder */
var SRCore = (function () {
  // ---- DICOM dictionary (the tags this viewer names; others show as numbers) ----
  // gggg,eeee|VR|Name. VRs matter for implicit-VR files.
  const DICT_SRC = `
0002,0000|UL|FileMetaInformationGroupLength 0002,0001|OB|FileMetaInformationVersion 0002,0002|UI|MediaStorageSOPClassUID
0002,0003|UI|MediaStorageSOPInstanceUID 0002,0010|UI|TransferSyntaxUID 0002,0012|UI|ImplementationClassUID
0002,0013|SH|ImplementationVersionName 0002,0016|AE|SourceApplicationEntityTitle
0008,0005|CS|SpecificCharacterSet 0008,0012|DA|InstanceCreationDate 0008,0013|TM|InstanceCreationTime 0008,0016|UI|SOPClassUID
0008,0018|UI|SOPInstanceUID 0008,0020|DA|StudyDate 0008,0021|DA|SeriesDate 0008,0023|DA|ContentDate 0008,0030|TM|StudyTime
0008,0031|TM|SeriesTime 0008,0033|TM|ContentTime 0008,0050|SH|AccessionNumber 0008,0060|CS|Modality 0008,0070|LO|Manufacturer
0008,0080|LO|InstitutionName 0008,0090|PN|ReferringPhysicianName 0008,0100|SH|CodeValue 0008,0102|SH|CodingSchemeDesignator
0008,0103|SH|CodingSchemeVersion 0008,0104|LO|CodeMeaning 0008,0105|CS|MappingResource 0008,0119|UC|LongCodeValue
0008,0120|UR|URNCodeValue 0008,1010|SH|StationName 0008,1030|LO|StudyDescription 0008,103E|LO|SeriesDescription
0008,1040|LO|InstitutionalDepartmentName 0008,1070|PN|OperatorsName 0008,1090|LO|ManufacturerModelName
0008,1111|SQ|ReferencedPerformedProcedureStepSequence 0008,1115|SQ|ReferencedSeriesSequence 0008,1140|SQ|ReferencedImageSequence
0008,1150|UI|ReferencedSOPClassUID 0008,1155|UI|ReferencedSOPInstanceUID 0008,1199|SQ|ReferencedSOPSequence
0010,0010|PN|PatientName 0010,0020|LO|PatientID 0010,0021|LO|IssuerOfPatientID 0010,0030|DA|PatientBirthDate
0010,0040|CS|PatientSex 0010,1010|AS|PatientAge 0010,1020|DS|PatientSize 0010,1030|DS|PatientWeight
0018,1000|LO|DeviceSerialNumber 0018,1020|LO|SoftwareVersions
0020,000D|UI|StudyInstanceUID 0020,000E|UI|SeriesInstanceUID 0020,0010|SH|StudyID 0020,0011|IS|SeriesNumber 0020,0013|IS|InstanceNumber
0032,1060|LO|RequestedProcedureDescription 0040,0275|SQ|RequestAttributesSequence 0040,08EA|SQ|MeasurementUnitsCodeSequence
0040,A010|CS|RelationshipType 0040,A027|LO|VerifyingOrganization 0040,A030|DT|VerificationDateTime 0040,A032|DT|ObservationDateTime
0040,A040|CS|ValueType 0040,A043|SQ|ConceptNameCodeSequence 0040,A050|CS|ContinuityOfContent 0040,A073|SQ|VerifyingObserverSequence
0040,A075|PN|VerifyingObserverName 0040,A120|DT|DateTime 0040,A121|DA|Date 0040,A122|TM|Time 0040,A123|PN|PersonName
0040,A124|UI|UID 0040,A160|UT|TextValue 0040,A161|FD|FloatingPointValue 0040,A168|SQ|ConceptCodeSequence
0040,A300|SQ|MeasuredValueSequence 0040,A301|SQ|NumericValueQualifierCodeSequence 0040,A30A|DS|NumericValue
0040,A360|SQ|PredecessorDocumentsSequence 0040,A370|SQ|ReferencedRequestSequence 0040,A372|SQ|PerformedProcedureCodeSequence
0040,A375|SQ|CurrentRequestedProcedureEvidenceSequence 0040,A385|SQ|PertinentOtherEvidenceSequence 0040,A491|CS|CompletionFlag
0040,A492|LO|CompletionFlagDescription 0040,A493|CS|VerificationFlag 0040,A504|SQ|ContentTemplateSequence
0040,A525|SQ|IdenticalDocumentsSequence 0040,A730|SQ|ContentSequence 0040,DB00|CS|TemplateIdentifier 0040,DB73|UL|ReferencedContentItemIdentifier
0070,0022|FL|GraphicData 0070,0023|CS|GraphicType 0040,A0B0|US|ReferencedTimeOffsets
FFFE,E000|NONE|Item FFFE,E00D|NONE|ItemDelimitationItem FFFE,E0DD|NONE|SequenceDelimitationItem`;
  const DICT = {};
  for (const entry of DICT_SRC.trim().split(/\s+/)) {
    const [tag, vr, name] = entry.split('|');
    DICT[tag.replace(',', '').toUpperCase()] = { vr, name };
  }

  const SOP_CLASSES = {
    '1.2.840.10008.5.1.4.1.1.88.11': 'Basic Text SR', '1.2.840.10008.5.1.4.1.1.88.22': 'Enhanced SR',
    '1.2.840.10008.5.1.4.1.1.88.33': 'Comprehensive SR', '1.2.840.10008.5.1.4.1.1.88.34': 'Comprehensive 3D SR',
    '1.2.840.10008.5.1.4.1.1.88.35': 'Extensible SR', '1.2.840.10008.5.1.4.1.1.88.59': 'Key Object Selection',
    '1.2.840.10008.5.1.4.1.1.88.67': 'X-Ray Radiation Dose SR', '1.2.840.10008.5.1.4.1.1.88.72': 'Simplified Adult Echo SR',
  };
  const TEMPLATES = {
    1500: 'Measurement Report', 2000: 'Basic Diagnostic Imaging Report', 5000: 'OB-GYN Ultrasound Procedure Report',
    5100: 'Vascular Ultrasound Procedure Report', 5200: 'Echocardiography Procedure Report',
    10001: 'Projection X-Ray Radiation Dose', 10011: 'CT Radiation Dose',
  };
  const TRANSFER_SYNTAXES = {
    '1.2.840.10008.1.2': 'Implicit VR Little Endian', '1.2.840.10008.1.2.1': 'Explicit VR Little Endian',
    '1.2.840.10008.1.2.1.99': 'Deflated Explicit VR Little Endian', '1.2.840.10008.1.2.2': 'Explicit VR Big Endian',
  };

  const LONG_VRS = new Set(['OB', 'OD', 'OF', 'OL', 'OV', 'OW', 'SQ', 'SV', 'UC', 'UN', 'UR', 'UT', 'UV']);
  const TEXT_VRS = new Set(['AE', 'AS', 'CS', 'DA', 'DS', 'DT', 'IS', 'LO', 'LT', 'PN', 'SH', 'ST', 'TM', 'UC', 'UI', 'UR', 'UT']);
  const SINGLE_TEXT = new Set(['LT', 'ST', 'UT', 'UR']);   // backslash is not a separator
  const UNDEFINED = 0xFFFFFFFF;
  const MAX_DEPTH = 64;

  const hex4 = n => n.toString(16).toUpperCase().padStart(4, '0');
  const tagKey = (g, e) => hex4(g) + hex4(e);
  const tagLabel = key => `(${key.slice(0, 4)},${key.slice(4)})`;

  class Reader {
    constructor(bytes, littleEndian, explicit, charset) {
      this.bytes = bytes; this.view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      this.le = littleEndian; this.explicit = explicit; this.pos = 0; this.charset = charset || 'latin1';
    }
    need(n) { if (this.pos + n > this.bytes.length) throw new Error(`The file ends unexpectedly at byte ${this.pos} (needed ${n} more).`); }
    u16() { this.need(2); const v = this.view.getUint16(this.pos, this.le); this.pos += 2; return v; }
    u32() { this.need(4); const v = this.view.getUint32(this.pos, this.le); this.pos += 4; return v; }
    ascii(n) { this.need(n); let s = ''; for (let i = 0; i < n; i++) s += String.fromCharCode(this.bytes[this.pos + i]); this.pos += n; return s; }
    slice(n) { this.need(n); const b = this.bytes.subarray(this.pos, this.pos + n); this.pos += n; return b; }
  }

  function decodeText(bytes, vr, charset) {
    let label = 'latin1';
    if (/ISO_IR 192/.test(charset || '')) label = 'utf-8';
    let s = new TextDecoder(label).decode(bytes);
    s = s.replace(/[\0 ]+$/, '');
    if (vr !== 'UT' && vr !== 'LT' && vr !== 'ST') s = s.replace(/^ +/, '');
    return SINGLE_TEXT.has(vr) ? [s] : s.split('\\');
  }

  function decodeValue(bytes, vr, r) {
    if (TEXT_VRS.has(vr)) return decodeText(bytes, vr, r.charset);
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const read = (size, fn) => { const out = []; for (let i = 0; i + size <= bytes.length; i += size) out.push(dv[fn](i, r.le)); return out; };
    switch (vr) {
      case 'US': return read(2, 'getUint16');
      case 'SS': return read(2, 'getInt16');
      case 'UL': return read(4, 'getUint32');
      case 'SL': return read(4, 'getInt32');
      case 'FL': return read(4, 'getFloat32');
      case 'FD': return read(8, 'getFloat64');
      case 'AT': { const out = []; for (let i = 0; i + 4 <= bytes.length; i += 4) out.push(tagLabel(tagKey(dv.getUint16(i, r.le), dv.getUint16(i + 2, r.le)))); return out; }
      default: return null;   // binary: OB, OW, UN… (kept as bytes)
    }
  }

  // Reads one element at r.pos. Returns the element, or { delimiter } for
  // the item / sequence delimiters that end undefined-length items and
  // sequences.
  function readElement(r, depth) {
    const offset = r.pos;
    const group = r.u16(); const elem = r.u16();
    const key = tagKey(group, elem);
    if (group === 0xFFFE) {
      r.u32();
      if (elem === 0xE00D) return { delimiter: 'item' };
      if (elem === 0xE0DD) return { delimiter: 'sequence' };
      return { skip: true };
    }
    let vr; let len;
    if (r.explicit) {
      vr = r.ascii(2);
      if (!/^[A-Z]{2}$/.test(vr)) throw new Error(`Unreadable value representation at byte ${offset + 4}.`);
      if (LONG_VRS.has(vr)) { r.pos += 2; len = r.u32(); } else len = r.u16();
    } else {
      len = r.u32();
      vr = DICT[key]?.vr || (len === UNDEFINED ? 'SQ' : (elem === 0x0000 ? 'UL' : 'UN'));
      if (group % 2 === 1 && elem >= 0x0010 && elem <= 0x00FF && vr === 'UN') vr = 'LO';   // private creator
    }
    const el = { tag: key, vr, length: len, offset, name: DICT[key]?.name || (group % 2 === 1 ? 'Private' : '') };
    if (vr === 'SQ' || (vr === 'UN' && len === UNDEFINED)) {
      if (vr === 'UN') {
        // An undefined-length UN is a sequence encoded as implicit VR little endian.
        const inner = new Reader(r.bytes, true, false, r.charset);
        inner.pos = r.pos;
        el.vr = 'SQ';
        el.items = readItems(inner, len, depth);
        r.pos = inner.pos;
      } else {
        el.items = readItems(r, len, depth);
      }
    } else {
      if (len === UNDEFINED) throw new Error(`${tagLabel(key)} has an undefined length but isn't a sequence (encapsulated pixel data isn't supported).`);
      el.bytes = r.slice(len);
      el.value = decodeValue(el.bytes, vr, r);
      if (key === '00080005' && el.value) r.charset = el.value.join('\\');
    }
    return el;
  }

  // Reads elements up to `end`, or (inside an undefined-length item) up to
  // the item delimiter, which must then be there.
  function readDataset(r, end, depth, untilDelimiter = false) {
    if (depth > MAX_DEPTH) throw new Error('Sequences are nested too deeply.');
    const elements = [];
    while (r.pos < end) {
      const el = readElement(r, depth);
      if (el.delimiter) return elements;
      if (!el.skip) elements.push(el);
    }
    if (untilDelimiter) throw new Error('The file ends unexpectedly inside a sequence item.');
    return elements;
  }

  function readItems(r, len, depth) {
    const items = [];
    const end = len === UNDEFINED ? r.bytes.length : r.pos + len;
    while (r.pos < end) {
      const group = r.u16(); const elem = r.u16(); const itemLen = r.u32();
      if (group !== 0xFFFE) throw new Error(`Expected a sequence item at byte ${r.pos - 8}.`);
      if (elem === 0xE0DD) return items;                // end of an undefined-length sequence
      if (elem !== 0xE000) continue;
      if (itemLen === UNDEFINED) items.push(readDataset(r, r.bytes.length, depth + 1, true));
      else {
        const itemEnd = r.pos + itemLen;
        if (itemEnd > r.bytes.length) throw new Error(`The file ends unexpectedly at byte ${r.bytes.length} (inside a sequence item).`);
        items.push(readDataset(r, itemEnd, depth + 1));
        r.pos = itemEnd;
      }
    }
    if (len === UNDEFINED) throw new Error('The file ends unexpectedly inside a sequence.');
    return items;
  }

  // Parses a DICOM file (Uint8Array). Deflated files need an inflate
  // function (the page passes one built on DecompressionStream).
  async function parse(bytes, { inflate } = {}) {
    const hasPreamble = bytes.length >= 132 && String.fromCharCode(...bytes.subarray(128, 132)) === 'DICM';
    // Without the "DICM" header, accept only data that starts like a DICOM
    // dataset (group 0002 or 0008), so other files get a plain message.
    if (!hasPreamble) {
      const g = bytes.length >= 2 ? bytes[0] | (bytes[1] << 8) : -1;
      if (g !== 0x0002 && g !== 0x0008) throw new Error('This doesn’t look like a DICOM file.');
    }
    const meta = [];
    let ts = '1.2.840.10008.1.2';   // files without a meta header are implicit VR little endian
    let pos = 0;
    if (hasPreamble) {
      // The file meta group (0002) is always explicit VR little endian.
      const r = new Reader(bytes, true, true);
      r.pos = 132;
      while (r.pos + 4 <= bytes.length && r.view.getUint16(r.pos, true) === 0x0002) {
        const el = readElement(r, 0);
        if (!el.delimiter && !el.skip) meta.push(el);
      }
      const tsEl = meta.find(e => e.tag === '00020010');
      if (tsEl?.value?.[0]) ts = tsEl.value[0];
      pos = r.pos;
    }
    if (!TRANSFER_SYNTAXES[ts]) throw new Error(`Transfer syntax ${ts} isn't supported (SR files normally use explicit or implicit VR little endian).`);
    let body = bytes.subarray(pos);
    if (ts === '1.2.840.10008.1.2.1.99') {
      if (!inflate) throw new Error('This file is deflate-compressed, which needs a newer browser.');
      body = await inflate(body);
    }
    const r = new Reader(body, ts !== '1.2.840.10008.1.2.2', ts !== '1.2.840.10008.1.2');
    const dataset = readDataset(r, body.length, 0);
    return { hasPreamble, transferSyntax: ts, transferSyntaxName: TRANSFER_SYNTAXES[ts], meta, dataset };
  }

  // ---- dataset helpers ----
  const find = (els, tag) => (els || []).find(e => e.tag === tag);
  const str = (els, tag) => { const e = find(els, tag); return e?.value ? e.value.join('\\') : ''; };
  const items = (els, tag) => find(els, tag)?.items || [];
  const code = els => (els ? {
    value: str(els, '00080100') || str(els, '00080119') || str(els, '00080120'),
    scheme: str(els, '00080102'), meaning: str(els, '00080104'),
  } : null);
  const codeKey = c => (c ? `${c.scheme}:${c.value}` : '');

  // ---- SR content tree ----
  function contentItem(els, depth) {
    const node = {
      relationship: str(els, '0040A010') || null,
      valueType: str(els, '0040A040'),
      concept: code(items(els, '0040A043')[0]),
      children: [],
    };
    switch (node.valueType) {
      case 'NUM': {
        const mv = items(els, '0040A300')[0];
        if (mv) {
          const fp = find(mv, '0040A161');
          node.value = fp?.value?.length ? fp.value[0] : (str(mv, '0040A30A') === '' ? null : Number(str(mv, '0040A30A')));
          node.valueText = fp?.value?.length ? String(fp.value[0]) : str(mv, '0040A30A');
          node.unit = code(items(mv, '004008EA')[0]);
        } else {
          node.value = null;

  const drop = $('#drop');
  window.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
  window.addEventListener('dragleave', (e) => { if (!e.relatedTarget) drop.classList.remove('over'); });
  window.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) openFile(f); });
})();
</script>
</body>
</html>
