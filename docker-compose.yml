# SPDX-License-Identifier: GPL-3.0-or-later
#
# SonoForms: Apache (HTTPS) -> Node.js app -> PostgreSQL.
# Run ./install.sh for first-time setup; it creates .env and secrets/.
#
# Networks:
#   public   web only; the published HTTPS/HTTP ports
#   proxy    web <-> app (internal: no outside access)
#   backend  app/migrate <-> db (internal: no outside access)
#   pacs     app's outbound DICOM queries to your PACS
#
# The "migrate" container applies database changes as the database owner
# and exits. The long-running "app" container connects as a restricted role
# that can't change the schema or alter the audit log, and never sees the
# owner password.

name: sonoforms

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonoforms
      POSTGRES_USER: sonoforms
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      TZ: "${TZ:-UTC}"
    secrets: [db_password]
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonoforms -d sonoforms"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  migrate:
    build: .
    image: sonoforms-app:latest
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      SONOFORMS_MODE: migrate
      PGHOST: db
      PGDATABASE: sonoforms
      PGUSER: sonoforms
      PGPASSWORD_FILE: /run/secrets/db_password
      PGAPPUSER: sonoforms_app
      PGAPPPASSWORD_FILE: /run/secrets/db_app_password
      SONOFORMS_MASTER_KEY_FILE: /run/secrets/master_key
      INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/initial_admin_password
      BACKUP_DIR: /backups
      TZ: "${TZ:-UTC}"
    secrets: [db_password, db_app_password, master_key, initial_admin_password]
    volumes:
      - ./backups:/backups
    networks: [backend]
    tmpfs: [/tmp]
    <<: *hardening
    logging: *logging

  app:
    build: .
    image: sonoforms-app:latest
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      SONOFORMS_MODE: serve
      PGHOST: db
      PGDATABASE: sonoforms
      PGUSER: sonoforms_app
      PGPASSWORD_FILE: /run/secrets/db_app_password
      SONOFORMS_MASTER_KEY_FILE: /run/secrets/master_key
      # Only Apache, on the internal proxy network, may report client addresses.
      TRUST_PROXY: "${PROXY_SUBNET:-172.31.250.0/28}"
      BACKUP_DIR: /backups
      BACKUP_HOUR: "${BACKUP_HOUR:-2}"
      BACKUP_KEEP: "${BACKUP_KEEP:-14}"
      DICOM_MOCK: "${DICOM_MOCK:-false}"
      TZ: "${TZ:-UTC}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    secrets: [db_app_password, master_key]
    volumes:
      - ./backups:/backups
    networks: [backend, proxy, pacs]
    tmpfs: [/tmp]
    <<: *hardening
    logging: *logging

  web:
    build: ./docker/apache
    image: sonoforms-web:latest
    restart: unless-stopped
    depends_on: [app]
    # Runs unprivileged on ports 8443/8080 inside the container.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    environment:
      SERVER_NAME: "${SERVER_NAME:-localhost}"
      HTTPS_PORT: "${HTTPS_PORT:-443}"
    ports:
      - "${HTTPS_PORT:-443}:8443"
      - "${HTTP_PORT:-80}:8080"
    volumes:
      - ./certs:/certs
    networks: [proxy, public]
    tmpfs: [/usr/local/apache2/logs, /tmp]
    <<: *hardening
    logging: *logging

networks:
  public: {}
  proxy:
    internal: true
    ipam:
      config:
        - subnet: "${PROXY_SUBNET:-172.31.250.0/28}"
  backend:
    internal: true
  pacs: {}

volumes:
  db-data: {}

secrets:
  db_password:
    file: ./secrets/db_password
  db_app_password:
    file: ./secrets/db_app_password
  master_key:
    file: ./secrets/master_key
  initial_admin_password:
    file: ./secrets/initial_admin_password
