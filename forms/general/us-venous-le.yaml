        normal: phasic
        options:
          - { value: phasic, label: Phasic, text: Normal respiratory phasicity. }
          - { value: continuous, label: Continuous / nonphasic, text: "Continuous, nonphasic flow, which can be seen with more central venous obstruction." }
          - { value: pulsatile, label: Pulsatile, text: Pulsatile waveform. }
          - { value: not_assessed, label: Not assessed }
    report: |
      {{#if present(contra_cfv) and contra_cfv != 'not_assessed'}}
      {{#if side == 'right'}}LEFT{{else}}RIGHT{{/if}} COMMON FEMORAL VEIN: {{contra_cfv}}
      {{/if}}

  - id: impression
    title: Tech impression (preliminary)
    report: false
    fields:
      - id: tech_impression
        type: choice
        label: Overall
        options:
          - { value: normal, label: Normal study }
          - { value: abnormal, label: Abnormal – see findings }
