      {{/if}}
      {{#if l_testis_status != 'absent' and present(l_epi)}}
      LEFT EPIDIDYMIS: {{l_epi | cap}}{{#if present(l_epi_cyst_size)}} measuring {{l_epi_cyst_size}}{{/if}}.
      {{/if}}

  - id: extratesticular
    title: Hydrocele, varicocele, hernia
    fields:
      - id: hydrocele
        type: choice
        label: Hydrocele
        required: true
        normal: none
        options:
          - { value: none, label: None }
          - { value: right, label: Right, text: right }
          - { value: left, label: Left, text: left }
          - { value: bilateral, label: Bilateral, text: bilateral }
      - id: hydrocele_size
        type: choice
        label: Hydrocele size
        required: true
        show_if: "hydrocele in ['right', 'left', 'bilateral']"
        options:
          - { value: small, label: Small, text: small }
          - { value: moderate, label: Moderate, text: moderate }
          - { value: large, label: Large, text: large }
      - id: hydrocele_complex
        type: boolean
        label: Septations / internal debris
        show_if: "hydrocele in ['right', 'left', 'bilateral']"
      - id: varicocele
        type: choice
        label: Varicocele
        required: true
        normal: none
        options:
          - { value: none, label: None }
          - { value: right, label: Right, text: right }
          - { value: left, label: Left, text: left }
          - { value: bilateral, label: Bilateral, text: bilateral }
      - id: varicocele_size
        type: number
        label: Largest vein diameter
        unit: mm
        decimals: 1
        min: 1
        max: 10
        show_if: "varicocele in ['right', 'left', 'bilateral']"
      - id: valsalva
        type: choice
        label: With Valsalva
        show_if: "varicocele in ['right', 'left', 'bilateral']"
        options:
          - { value: reflux, label: Reflux / augments, text: with reflux during Valsalva }
          - { value: no_reflux, label: No reflux, text: without reflux during Valsalva }
          - { value: only, label: Seen only with Valsalva, text: visible only during Valsalva }
          - { value: not_assessed, label: Not assessed, text: "" }
      - id: hernia
        type: choice
        label: Inguinal hernia
        required: true
        normal: none
        options:
          - { value: none, label: None }
          - { value: right, label: Right, text: right }
          - { value: left, label: Left, text: left }
          - { value: bilateral, label: Bilateral, text: bilateral }
          - { value: not_assessed, label: Not assessed }
      - id: hernia_contents
        type: choice
        label: Hernia contents
        show_if: "hernia in ['right', 'left', 'bilateral']"
        options:
          - { value: fat, label: Fat, text: fat }
          - { value: bowel, label: Bowel, text: bowel }
          - { value: fluid, label: Fluid, text: fluid }
      - id: scrotal_wall
        type: choice
        label: Scrotal wall
        required: true
        normal: normal
        options:
          - { value: normal, label: Normal, text: "" }
          - { value: thickened, label: Thickened / edematous, text: Scrotal wall thickening and edema. }
          - { value: hyperemic, label: Thickened and hyperemic, text: Scrotal wall thickening with hyperemia. }
    report: |
      {{#if hydrocele == 'none' and varicocele == 'none' and hernia == 'none'}}
      EXTRATESTICULAR: No hydrocele, varicocele, or inguinal hernia. {{scrotal_wall}}
      {{else}}
      EXTRATESTICULAR: {{#if hydrocele == 'none'}}No hydrocele.{{else if present(hydrocele)}}{{#if present(hydrocele_size)}}{{hydrocele_size | cap}} {{hydrocele}}{{else}}{{hydrocele | cap}}{{/if}} hydrocele{{#if hydrocele == 'bilateral'}}s{{/if}}{{#if hydrocele_complex}} with internal septations or debris{{/if}}.{{/if}} {{#if varicocele == 'none'}}No varicocele.{{else if present(varicocele)}}{{varicocele | cap}} varicocele{{#if varicocele == 'bilateral'}}s{{/if}}{{#if present(varicocele_size)}} with veins measuring up to {{varicocele_size}}{{/if}}{{#if present(valsalva) and valsalva != 'not_assessed'}}, {{valsalva}}{{/if}}.{{/if}} {{#if hernia == 'none'}}No inguinal hernia.{{else if present(hernia) and hernia != 'not_assessed'}}{{hernia | cap}} inguinal hernia{{#if hernia == 'bilateral'}}s{{/if}}{{#if present(hernia_contents)}} containing {{hernia_contents}}{{/if}}.{{/if}} {{scrotal_wall}}
      {{/if}}

  - id: impression
    title: Tech impression (preliminary)
    report: false
    fields:
      - id: tech_impression
        type: choice
        label: Overall
        options:
          - { value: normal, label: Normal study }
          - { value: abnormal, label: Abnormal – see findings }
