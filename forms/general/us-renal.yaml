  - id: bladder
    title: Bladder
    fields:
      - id: bladder_status
        type: choice
        label: Bladder
        required: true
        default: distended
        options:
          - { value: distended, label: Distended, text: Adequately distended. }
          - { value: under, label: Underdistended, text: "Underdistended, limiting evaluation." }
          - { value: decompressed, label: Decompressed / empty }
          - { value: foley, label: Foley catheter in place }
      - id: pre_dims
        type: dims
        label: Pre-void bladder
        min: 1
        max: 20
        required: "bladder_status == 'distended'"
        show_if: "bladder_status in ['distended', 'under']"
      - id: pre_vol
        type: calc
        label: Pre-void volume
        formula: volume(pre_dims, 0.52)
        unit: mL
        decimals: 0
        show_if: "bladder_status in ['distended', 'under']"
      - id: bladder_findings
        type: choice
        label: Wall / lumen
        required: true
        show_if: "bladder_status in ['distended', 'under']"
        normal: normal
        options:
          - { value: normal, label: Normal, text: No bladder wall thickening or intraluminal abnormality. }
          - { value: thick, label: Diffuse wall thickening / trabeculation, text: Diffuse bladder wall thickening and trabeculation. }
          - { value: debris, label: Layering debris, text: Layering debris within the bladder. }
          - { value: stone, label: Bladder stone, text: Shadowing calculus within the bladder. }
          - { value: mass, label: Focal wall lesion / mass, text: Focal bladder wall lesion. }
          - { value: diverticulum, label: Diverticulum, text: Bladder diverticulum. }
        other: true
      - id: jets
        type: choice
        label: Ureteral jets
        show_if: "bladder_status in ['distended', 'under']"
        normal: bilateral
        options:
          - { value: bilateral, label: Bilateral, text: Bilateral ureteral jets are demonstrated. }
          - { value: right, label: Right only, text: A right ureteral jet is demonstrated. No left ureteral jet is seen. }
          - { value: left, label: Left only, text: A left ureteral jet is demonstrated. No right ureteral jet is seen. }
          - { value: none, label: None seen, text: No ureteral jets are demonstrated. }
          - { value: not_assessed, label: Not assessed, text: "" }
      - id: post_void
        type: choice
        label: Post-void imaging
        show_if: "bladder_status in ['distended', 'under']"
        default: done
        options:
          - { value: done, label: Performed }
          - { value: unable, label: Patient unable to void }
          - { value: not_done, label: Not performed }
      - id: post_dims
        type: dims
        label: Post-void bladder
        min: 0
        max: 20
        required: true
        show_if: "bladder_status in ['distended', 'under'] and post_void == 'done'"
      - id: post_vol
        type: calc
        label: Post-void residual
        formula: volume(post_dims, 0.52)
        unit: mL
        decimals: 0
        show_if: "bladder_status in ['distended', 'under'] and post_void == 'done'"
    report: |
      {{#if bladder_status == 'foley'}}
      BLADDER: Decompressed with a Foley catheter in place.
      {{else if bladder_status == 'decompressed'}}
      BLADDER: Decompressed, limiting evaluation.
      {{else}}
      BLADDER: {{bladder_status}}{{#if present(pre_vol)}} Pre-void volume {{pre_vol}}.{{/if}} {{bladder_findings | sentence}} {{jets}}{{#if present(post_vol)}} Post-void residual volume {{post_vol}}.{{else if post_void == 'unable'}} The patient was unable to void.{{/if}}
      {{/if}}

  - id: prostate
    title: Prostate
    show_if: "patient.sex == 'M'"
    fields:
      - id: prostate_dims
        type: dims
        label: Prostate (optional)
        help: Transabdominal, through the distended bladder
        min: 1
        max: 12
      - id: prostate_vol
        type: calc
        label: Prostate volume
        formula: ellipsoid(prostate_dims)
        unit: mL
        decimals: 0
    report: |
      {{#if present(prostate_vol)}}
      PROSTATE: Measures {{prostate_dims}} (volume {{prostate_vol}}).
      {{/if}}

  - id: impression
    title: Tech impression (preliminary)
    report: false
    fields:
      - id: tech_impression
        type: choice
        label: Overall
        options:
          - { value: normal, label: Normal study }
          - { value: abnormal, label: Abnormal – see findings }
