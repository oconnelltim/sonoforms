# Starter form. Review wording with your radiologists before clinical use.
id: us-renal
title: US Renal / Kidneys and Bladder
description: Renal and bladder ultrasound with bladder volumes and optional prostate volume.
study_match:
  - RENAL
  - KIDNEY
  - KIDNEYS
  - RETROPERITONEAL
  - US KIDNEYS BLADDER

report:
  heading: ULTRASOUND KIDNEYS AND BLADDER # used when reported together with other exams from the same visit

sections:
  - id: clinical
    title: Clinical
    fields:
      - id: indication
        type: multi
        label: Indication
        required: true
        other: true
        options:
          - { value: aki, label: Acute kidney injury / elevated creatinine, text: elevated creatinine }
          - { value: ckd, label: Chronic kidney disease, text: chronic kidney disease }
          - { value: flank_pain, label: Flank pain, text: flank pain }
          - { value: hematuria, label: Hematuria, text: hematuria }
          - { value: uti, label: UTI / pyelonephritis, text: urinary tract infection }
          - { value: stones, label: Nephrolithiasis, text: nephrolithiasis }
          - { value: hydro, label: Hydronephrosis follow-up, text: follow-up of hydronephrosis }
          - { value: retention, label: Urinary retention, text: urinary retention }
          - { value: htn, label: Hypertension, text: hypertension }
      - id: comparison
        type: text
        label: Comparison
        placeholder: "e.g. CT abdomen 03/14/2025, or leave blank for none"
    report:
      indication: |-
        {{indication | cap}}.
      comparison: |-
        {{#if present(comparison)}}{{comparison}}{{else}}None{{/if}}.
      technique: |-
        Grayscale and color Doppler ultrasound of the kidneys and urinary bladder was performed.

  - id: right_kidney
    title: Right kidney
    fields:
      - id: r_kid_status
        type: choice
        label: Right kidney
        required: true
        default: seen
        options:
          - { value: seen, label: Visualized }
          - { value: absent, label: Surgically absent }
          - { value: not_seen, label: Not visualized }
      - id: r_kid_length
        type: number
        label: Right kidney length
        unit: cm
        decimals: 1
        min: 7
        max: 15
        required: true
        show_if: "r_kid_status == 'seen'"
      - id: r_cortex
        type: choice
        label: Cortical echogenicity
        required: true
        show_if: "r_kid_status == 'seen'"
        normal: normal
        options:
          - { value: normal, label: Normal, text: Normal cortical echogenicity and corticomedullary differentiation. }
          - { value: increased, label: Increased, text: "Increased cortical echogenicity, which can be seen with medical renal disease." }
          - { value: thin, label: Cortical thinning, text: Diffuse cortical thinning. }
          - { value: scar, label: Focal cortical scar, text: Focal cortical scarring. }
      - id: r_hydro
        type: choice
        label: Hydronephrosis
        required: true
        show_if: "r_kid_status == 'seen'"
        normal: none
        options:
          - { value: none, label: None, text: No hydronephrosis. }
          - { value: mild, label: Mild, text: Mild hydronephrosis. }
          - { value: moderate, label: Moderate, text: Moderate hydronephrosis. }
          - { value: severe, label: Severe, text: Severe hydronephrosis. }
      - id: r_hydroureter
        type: boolean
        label: Proximal hydroureter
        show_if: "r_kid_status == 'seen' and r_hydro in ['mild', 'moderate', 'severe']"
      - id: r_stones
        type: choice
        label: Stones
        required: true
        show_if: "r_kid_status == 'seen'"
        normal: none
        options:
          - { value: none, label: None, text: No nephrolithiasis. }
          - { value: single, label: Single }
          - { value: multiple, label: Multiple }
      - id: r_stone_size
        type: number
        label: Largest stone
        unit: mm
        decimals: 0
        min: 1
        max: 50
        show_if: "r_kid_status == 'seen' and r_stones in ['single', 'multiple']"
      - id: r_stone_loc
        type: choice
        label: Location (largest stone)
        layout: dropdown
        show_if: "r_kid_status == 'seen' and r_stones in ['single', 'multiple']"
        options:
          - { value: upper, label: Upper pole, text: in the upper pole }
          - { value: inter, label: Interpolar, text: in the interpolar region }
          - { value: lower, label: Lower pole, text: in the lower pole }
          - { value: pelvis, label: Renal pelvis, text: in the renal pelvis }
          - { value: upj, label: UPJ, text: at the ureteropelvic junction }
      - id: r_cyst_status
        type: choice
        label: Cysts / masses
        required: true
        show_if: "r_kid_status == 'seen'"
        normal: none
        options:
          - { value: none, label: None }
          - { value: present, label: Present (describe) }
      - id: r_cysts
        type: repeat
        label: Right renal cysts / lesions
        item_label: Lesion
        max_items: 6
        required: true
        show_if: "r_kid_status == 'seen' and r_cyst_status == 'present'"
        fields:
          - id: location
            type: choice
            label: Location
            required: true
            options:
              - { value: upper, label: Upper pole, text: upper pole }
              - { value: inter, label: Interpolar, text: interpolar region }
              - { value: lower, label: Lower pole, text: lower pole }
              - { value: parapelvic, label: Parapelvic, text: parapelvic region }
          - id: kind
            type: choice
            label: Appearance
            required: true
            options:
              - { value: simple, label: Simple cyst, text: simple cyst }
              - { value: min_complex, label: Thin septation / few septa, text: cyst with a thin septation }
              - { value: complex, label: Complex cyst (thick septa / nodule), text: complex cystic lesion }
              - { value: echogenic, label: Echogenic (AML-like), text: echogenic lesion }
              - { value: solid, label: Solid, text: solid-appearing lesion }
            other: true
          - id: size
            type: number
            label: Maximum dimension
            unit: cm
            decimals: 1
            min: 0.2
            max: 20
            required: true
          - id: flow
            type: choice
            label: Internal flow
            show_if: "kind in ['complex', 'echogenic', 'solid', 'other']"
            options:
              - { value: none, label: None, text: No internal vascularity. }
              - { value: present, label: Present, text: Internal vascularity is present. }
    report: |
      {{#if r_kid_status == 'absent'}}
      RIGHT KIDNEY: Surgically absent.
      {{else if r_kid_status == 'not_seen'}}
      RIGHT KIDNEY: Not visualized.
      {{else if r_hydro == 'none' and r_stones == 'none' and r_cyst_status == 'none'}}
      RIGHT KIDNEY: Measures {{r_kid_length}} in length. {{r_cortex}} No hydronephrosis, nephrolithiasis, or mass.
      {{else}}
      RIGHT KIDNEY: Measures {{r_kid_length}} in length. {{r_cortex}} {{r_hydro}}{{#if r_hydroureter}} Proximal hydroureter is present.{{/if}} {{#if r_stones == 'single'}}A {{#if present(r_stone_size)}}{{r_stone_size}} {{/if}}calculus{{#if present(r_stone_loc)}} {{r_stone_loc}}{{/if}}.{{else if r_stones == 'multiple'}}Multiple calculi{{#if present(r_stone_size)}}, the largest measuring {{r_stone_size}}{{/if}}{{#if present(r_stone_loc)}} {{r_stone_loc}}{{/if}}.{{else}}{{r_stones}}{{/if}}{{#if r_cyst_status == 'none'}} No renal cyst or mass.{{/if}}
      {{#each r_cysts}}
      - {{location | cap}}: {{size}} {{kind}}.{{#if present(flow)}} {{flow}}{{/if}}
      {{/each}}
      {{/if}}

