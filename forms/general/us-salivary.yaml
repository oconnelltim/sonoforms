# Starter form. Review wording with your radiologists before clinical use.
#
# Salivary gland ultrasound: parotid and submandibular glands, often done
# together with a thyroid study. The technique section picks which glands
# were examined; gland sections that were not examined are hidden.
id: us-salivary
title: US Salivary Glands
description: Parotid and submandibular gland ultrasound (swelling, lump, pain, sialadenitis or stone, mass follow-up, Sjögren).
# Adjust study_match to the study descriptions your PACS uses.
study_match:
  - US SALIVARY
  - US PAROTID
  - US SUBMANDIBULAR
  - SALIVARY GLAND
  - PAROTID
  - SUBMANDIBULAR

report:
  heading: ULTRASOUND SALIVARY GLANDS # used when reported together with other exams from the same visit

sections:
  - id: clinical
    title: Clinical
    fields:
      - id: indication
        type: multi
        label: Indication
        required: true
        other: true
        options:
          - { value: swelling, label: Swelling, text: salivary gland swelling }
          - { value: lump, label: Palpable lump, text: palpable lump }
          - { value: pain, label: Pain, text: pain }
          - { value: meals, label: Swelling or pain with meals, text: swelling or pain with meals }
          - { value: sialadenitis, label: Suspected sialadenitis, text: suspected sialadenitis }
          - { value: stone, label: Suspected stone, text: suspected sialolithiasis }
          - { value: mass_fu, label: Mass follow-up, text: follow-up of salivary gland mass }
          - { value: sjogren, label: Sjögren syndrome (known or suspected), text: known or suspected Sjögren syndrome }
          - { value: incidental, label: Incidental finding on CT / MRI / PET, text: incidental salivary gland finding on prior imaging }
      - id: ind_site
        type: multi
        label: Side / region (optional)
        options:
          - { value: rp, label: Right parotid, text: right parotid }
          - { value: lp, label: Left parotid, text: left parotid }
          - { value: rs, label: Right submandibular, text: right submandibular }
          - { value: ls, label: Left submandibular, text: left submandibular }
      - id: comparison
        type: text
        label: Comparison
        placeholder: "e.g. US salivary glands 03/14/2025, or leave blank for none"
    report:
      indication: |-
        {{indication | cap}}{{#if present(ind_site)}} ({{ind_site}} region{{#if count(ind_site) > 1}}s{{/if}}){{/if}}.
      comparison: |-
        {{#if present(comparison)}}{{comparison}}{{else}}None{{/if}}.

  - id: technique
    title: Technique
    fields:
      - id: glands
        type: choice
        label: Glands examined
        required: true
        default: all
        options:
          - { value: all, label: Both parotid and both submandibular glands, text: the bilateral parotid and submandibular glands }
          - { value: parotids, label: Both parotid glands, text: the bilateral parotid glands }
          - { value: submandibulars, label: Both submandibular glands, text: the bilateral submandibular glands }
          - { value: select, label: Selected glands }
      - id: glands_selected
        type: multi
        label: Which glands
        required: true
        show_if: "glands == 'select'"
        options:
          - { value: rp, label: Right parotid, text: right parotid }
          - { value: lp, label: Left parotid, text: left parotid }
          - { value: rs, label: Right submandibular, text: right submandibular }
          - { value: ls, label: Left submandibular, text: left submandibular }
      - id: with_thyroid
        type: boolean
        label: Performed together with a thyroid ultrasound
    report_field: technique
    report: |
      Grayscale and color Doppler ultrasound of {{#if glands == 'select'}}the {{glands_selected}} gland{{#if count(glands_selected) > 1}}s{{/if}}{{else}}{{glands}}{{/if}} was performed.{{#if with_thyroid}} The study was performed together with a thyroid ultrasound.{{/if}}

  - id: right_parotid
    title: Right parotid
    show_if: "glands in ['all', 'parotids'] or (glands == 'select' and has(glands_selected, 'rp'))"
    fields:
      - id: rp_status
        type: choice
        label: Right parotid gland
        required: true
        default: seen
        normal: seen
        options:
          - { value: seen, label: Visualized }
          - { value: not_seen, label: Not visualized }
          - { value: absent, label: Surgically absent }
      - id: rp_size
        type: dims
        label: Size (optional)
        decimals: 1
        help: Length (craniocaudal) x AP x width (transverse)
        min: 0.5
        max: 10
        show_if: "rp_status == 'seen'"
      - id: rp_echo
        type: choice
        label: Echotexture
        required: true
        other: true
        show_if: "rp_status == 'seen'"
        normal: homogeneous
        options:
          - { value: homogeneous, label: Homogeneous (normal), text: homogeneous echotexture }
          - { value: heterogeneous, label: Heterogeneous, text: heterogeneous echotexture }
          - { value: hypoechoic, label: Diffusely hypoechoic, text: diffusely hypoechoic parenchyma }
          - { value: sjogren, label: Multiple small hypoechoic foci (Sjögren pattern), text: "heterogeneous parenchyma with multiple small hypoechoic or anechoic foci, a pattern that can be seen with Sjögren syndrome" }
          - { value: atrophic, label: Small and echogenic (atrophic), text: "small, echogenic gland, which can be seen with atrophy or chronic sialadenitis" }
      - id: rp_vasc
        type: choice
        label: Vascularity
        required: true
        show_if: "rp_status == 'seen'"
        normal: normal
        options:
          - { value: normal, label: Normal, text: normal vascularity }
          - { value: increased, label: Increased, text: increased vascularity }
      - id: rp_ducts
        type: choice
        label: Ductal dilatation
        required: true
        show_if: "rp_status == 'seen'"
        normal: none
        options:
          - { value: none, label: None, text: no ductal dilatation }
          - { value: intra, label: Intraglandular ducts, text: dilated intraglandular ducts }
          - { value: main, label: Main (Stensen) duct, text: dilated main (Stensen) duct }
          - { value: both, label: Both, text: dilated intraglandular ducts and main (Stensen) duct }
      - id: rp_calculi
        type: choice
        label: Calculi
        required: true
        show_if: "rp_status == 'seen'"
        normal: none
        options:
          - { value: none, label: None }
          - { value: present, label: Present }
      - id: rp_stone
        type: number
        label: Largest calculus
        unit: mm
        min: 1
        max: 30
        width: short
        required: true
        show_if: "rp_status == 'seen' and rp_calculi == 'present'"
      - id: rp_stone_multiple
        type: boolean
        label: Multiple calculi
        show_if: "rp_status == 'seen' and rp_calculi == 'present'"
      - id: rp_stone_loc
        type: choice
        label: Location of the largest calculus
        show_if: "rp_status == 'seen' and rp_calculi == 'present'"
        options:
          - { value: gland, label: Within the gland, text: within the gland }
          - { value: hilum, label: At the hilum, text: at the hilum }
          - { value: duct, label: In the main (Stensen) duct, text: in the main (Stensen) duct }
      - id: rp_nodes
        type: choice
        label: Intraparotid lymph nodes
        required: true
        show_if: "rp_status == 'seen'"
        normal: normal
        options:
          - { value: normal, label: None or normal-appearing, text: no abnormal intraparotid lymph nodes }
          - { value: abnormal, label: Abnormal (describe) }
      - id: rp_nodes_note
        type: text
        label: Abnormal intraparotid lymph node(s)
        placeholder: "e.g. 1.2 x 0.9 cm, rounded, no fatty hilum"
        required: true
        show_if: "rp_status == 'seen' and rp_nodes == 'abnormal'"
    report: |
      {{#if rp_status == 'not_seen'}}
      RIGHT PAROTID: Not visualized.
      {{else if rp_status == 'absent'}}
      RIGHT PAROTID: Surgically absent.
      {{else if rp_status == 'seen'}}
      RIGHT PAROTID:{{#if present(rp_size)}} Measures {{rp_size}}.{{/if}} {{rp_echo | sentence}} {{rp_vasc | sentence}} {{rp_ducts | sentence}} {{#if rp_calculi == 'present'}}{{#if rp_stone_multiple}}Multiple calculi, the largest{{else}}Calculus{{/if}} measuring {{rp_stone}}{{#if present(rp_stone_loc)}} {{rp_stone_loc}}{{/if}}.{{else if rp_calculi == 'none'}}No calculi.{{/if}} {{#if rp_nodes == 'abnormal'}}Abnormal intraparotid lymph node(s): {{rp_nodes_note}}.{{else}}{{rp_nodes | sentence}}{{/if}}
      {{/if}}

