  - id: masses_section
    title: Masses
    fields:
      - id: mass_status
        type: choice
        label: Focal masses
        required: true
        normal: none
        options:
          - { value: none, label: None }
          - { value: present, label: Present (describe each below) }
      - id: masses
        type: repeat
        label: Masses
        item_label: Mass
        max_items: 6
        required: true
        show_if: "mass_status == 'present'"
        fields:
          - id: gland
            type: choice
            label: Gland
            required: true
            options:
              - { value: rp, label: Right parotid, text: right parotid gland }
              - { value: lp, label: Left parotid, text: left parotid gland }
              - { value: rs, label: Right submandibular, text: right submandibular gland }
              - { value: ls, label: Left submandibular, text: left submandibular gland }
          - id: site
            type: choice
            label: Location in the parotid
            show_if: "gland in ['rp', 'lp']"
            options:
              - { value: superficial, label: Superficial lobe, text: superficial lobe }
              - { value: deep, label: Deep lobe, text: deep lobe }
              - { value: tail, label: Tail (inferior pole), text: parotid tail }
          - id: size
            type: dims
            label: Size
            help: Length (craniocaudal) x AP x width (transverse)
            min: 0.2
            max: 10
            required: true
          - id: composition
            type: choice
            label: Cystic / solid
            required: true
            options:
              - { value: solid, label: Solid, text: solid }
              - { value: mostly_solid, label: Predominantly solid, text: predominantly solid }
              - { value: mostly_cystic, label: Predominantly cystic, text: predominantly cystic }
              - { value: cystic, label: Cystic, text: cystic }
          - id: echogenicity
            type: choice
            label: Echogenicity
            required: true
            options:
              - { value: hypoechoic, label: Hypoechoic, text: hypoechoic }
              - { value: isoechoic, label: Isoechoic, text: isoechoic }
              - { value: hyperechoic, label: Hyperechoic, text: hyperechoic }
              - { value: heterogeneous, label: Heterogeneous, text: heterogeneous }
              - { value: anechoic, label: Anechoic, text: anechoic }
          - id: margins
            type: choice
            label: Margins
            required: true
            options:
              - { value: circumscribed, label: Well-circumscribed, text: well-circumscribed margins }
              - { value: lobulated, label: Lobulated, text: lobulated margins }
              - { value: ill_defined, label: Ill-defined, text: ill-defined margins }
              - { value: irregular, label: Irregular / infiltrative, text: irregular margins }
          - id: vascularity
            type: choice
            label: Internal vascularity
            required: true
            options:
              - { value: none, label: None, text: no internal vascularity }
              - { value: internal, label: Internal, text: internal vascularity }
              - { value: peripheral, label: Peripheral only, text: peripheral vascularity only }
              - { value: marked, label: Marked internal, text: marked internal vascularity }
          - id: calcification
            type: choice
            label: Calcification
            options:
              - { value: none, label: None, text: no calcification }
              - { value: present, label: Present, text: contains calcification }
          - id: enhancement
            type: boolean
            label: Posterior acoustic enhancement
          - id: change
            type: choice
            label: Compared with prior
            options:
              - { value: new, label: New, text: New since the prior examination. }
              - { value: stable, label: Stable, text: Stable compared with the prior examination. }
              - { value: larger, label: Enlarged, text: Increased in size compared with the prior examination. }
              - { value: smaller, label: Smaller, text: Decreased in size compared with the prior examination. }
          - id: note
            type: text
            label: Note (optional)
    report: |
      {{#if mass_status == 'none'}}
      MASSES: No focal mass.
      {{else if mass_status == 'present'}}
      MASSES:
      {{#each masses}}
      - Mass {{@index}} ({{gland}}{{#if present(site)}}, {{site}}{{/if}}): Measures {{size}}. {{composition | cap}} and {{echogenicity}}, with {{margins}}. {{vascularity | sentence}} {{calcification | sentence}}{{#if enhancement}} Posterior acoustic enhancement.{{/if}} {{note | sentence}} {{change}}
      {{/each}}
      {{/if}}

  - id: lymph_nodes
    title: Cervical lymph nodes
    fields:
      - id: ln_status
        type: choice
        label: Cervical lymph nodes
        required: true
        normal: normal
        options:
          - { value: normal, label: None abnormal }
          - { value: abnormal, label: Abnormal (describe) }
          - { value: not_assessed, label: Not assessed }
      - id: ln_note
        type: textarea
        label: Abnormal lymph node(s)
        placeholder: "Side, level, size, abnormal features (e.g. right level II, 1.8 x 1.2 cm, no fatty hilum)"
        rows: 2
        required: true
        show_if: "ln_status == 'abnormal'"
    report: |
      {{#if ln_status == 'normal'}}
      CERVICAL LYMPH NODES: No abnormal cervical lymph nodes.
      {{else if ln_status == 'abnormal'}}
      CERVICAL LYMPH NODES: {{ln_note | sentence}}
      {{else if ln_status == 'not_assessed'}}
      CERVICAL LYMPH NODES: Not assessed.
      {{/if}}
