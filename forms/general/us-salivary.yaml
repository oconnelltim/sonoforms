      - id: lp_stone_loc
        type: choice
        label: Location of the largest calculus
        show_if: "lp_status == 'seen' and lp_calculi == 'present'"
        options:
          - { value: gland, label: Within the gland, text: within the gland }
          - { value: hilum, label: At the hilum, text: at the hilum }
