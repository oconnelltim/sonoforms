    report: |
      {{#if lp_status == 'not_seen'}}
      LEFT PAROTID: Not visualized.
      {{else if lp_status == 'absent'}}
      LEFT PAROTID: Surgically absent.
      {{else if lp_status == 'seen'}}
      LEFT PAROTID:{{#if present(lp_size)}} Measures {{lp_size}}.{{/if}} {{lp_echo | sentence}} {{lp_vasc | sentence}} {{lp_ducts | sentence}} {{#if lp_calculi == 'present'}}{{#if lp_stone_multiple}}Multiple calculi, the largest{{else}}Calculus{{/if}} measuring {{lp_stone}}{{#if present(lp_stone_loc)}} {{lp_stone_loc}}{{/if}}.{{else if lp_calculi == 'none'}}No calculi.{{/if}} {{#if lp_nodes == 'abnormal'}}Abnormal intraparotid lymph node(s): {{lp_nodes_note}}.{{else}}{{lp_nodes | sentence}}{{/if}}
      {{/if}}

